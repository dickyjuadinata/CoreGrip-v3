<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CoreGrip</title>
  <link id="manifest-placeholder" rel="manifest">
  
  <meta name="theme-color" content="#0066FF">
  <meta name="description" content="CoreGrip - Enterprise-grade resistance training log and auto-progression tracking application.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CoreGrip">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Light Theme (Default) */
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-subcard: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --nav-bg: rgba(255, 255, 255, 0.85);
      --input-bg: #f8fafc;
    }

    /* Dark Theme */
    .dark {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-subcard: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --nav-bg: rgba(21, 28, 44, 0.85);
      --input-bg: #0f172a;
    }

    .themed-bg { background-color: var(--bg-main); }
    .themed-card { background-color: var(--bg-card); }
    .themed-subcard { background-color: var(--bg-subcard); }
    .themed-text { color: var(--text-main); }
    .themed-text-muted { color: var(--text-muted); }
    .themed-border { border-color: var(--border-color); }
    .themed-nav { background-color: var(--nav-bg); }
    .themed-input { background-color: var(--input-bg); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 3s infinite ease-in-out;
    }

    /* Pull to Refresh Spinner */
    #ptr-indicator {
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
  </style>
</head>
<body class="themed-bg themed-text min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white pb-24 md:pb-0">

  <div id="ptr-indicator" class="fixed top-0 left-0 right-0 z-50 flex justify-center items-center py-3 opacity-0 pointer-events-none transform -translate-y-full">
    <div class="themed-card border themed-border px-4 py-2 rounded-full shadow-lg flex items-center space-x-2 text-xs font-semibold text-blue-500">
      <i data-lucide="refresh-cw" class="w-4 h-4 animate-spin" id="ptr-icon"></i>
      <span id="ptr-text">Tarikh untuk memperbarui...</span>
    </div>
  </div>

  <header class="sticky top-0 z-40 backdrop-blur-md themed-nav border-b themed-border px-4 py-3 transition-all duration-200">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20 font-black text-lg tracking-wider">
          C
        </div>
        <div>
          <h1 class="font-extrabold text-base leading-tight tracking-tight flex items-center gap-1.5">
            CoreGrip
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-blue-500/10 text-blue-500 border border-blue-500/20">PRO</span>
          </h1>
          <p class="text-[10px] themed-text-muted font-medium leading-none">Auto-Progression Engine</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-xl themed-subcard text-slate-500 hover:text-blue-500 transition-colors border themed-border" aria-label="Toggle Theme">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
        </button>

        <div id="headerAuthWidget">
          </div>
      </div>
    </div>
  </header>

  <nav id="mainNav" class="hidden fixed bottom-0 left-0 right-0 z-40 md:sticky md:top-[61px] themed-nav border-t md:border-t-0 md:border-b themed-border backdrop-blur-md transition-all duration-200">
    <div class="max-w-5xl mx-auto px-2 md:px-4">
      <div class="flex justify-around md:justify-start md:space-x-2 py-2 md:py-1.5">
        <button onclick="switchTab('log')" id="nav-log" class="nav-btn flex flex-col md:flex-row items-center justify-center py-1.5 px-3 md:px-4 rounded-xl text-xs font-semibold transition-all text-blue-600 bg-blue-500/10">
          <i data-lucide="notebook-pen" class="w-5 h-5 md:w-4 md:h-4 md:mr-2 mb-1 md:mb-0"></i>
          <span>Workout Log</span>
        </button>
        <button onclick="switchTab('analytics')" id="nav-analytics" class="nav-btn flex flex-col md:flex-row items-center justify-center py-1.5 px-3 md:px-4 rounded-xl text-xs font-semibold transition-all themed-text-muted hover:bg-slate-500/10">
          <i data-lucide="trending-up" class="w-5 h-5 md:w-4 md:h-4 md:mr-2 mb-1 md:mb-0"></i>
          <span>Analytics</span>
        </button>
        <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col md:flex-row items-center justify-center py-1.5 px-3 md:px-4 rounded-xl text-xs font-semibold transition-all themed-text-muted hover:bg-slate-500/10">
          <i data-lucide="history" class="w-5 h-5 md:w-4 md:h-4 md:mr-2 mb-1 md:mb-0"></i>
          <span>History</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col md:flex-row items-center justify-center py-1.5 px-3 md:px-4 rounded-xl text-xs font-semibold transition-all themed-text-muted hover:bg-slate-500/10">
          <i data-lucide="settings" class="w-5 h-5 md:w-4 md:h-4 md:mr-2 mb-1 md:mb-0"></i>
          <span>Settings</span>
